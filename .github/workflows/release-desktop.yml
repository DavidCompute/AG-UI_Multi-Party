name: Release (Windows Desktop MSI)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.108). Leave blank to read from project <Version>."
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 同一 tag 重复推送 / 手动重跑时串行化，避免同时向同一 release 上传附件
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-msi:
    name: Build & publish Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install WiX v4 tool
        shell: pwsh
        run: dotnet tool install -g wix --version "4.*"

      # 本地 embedding 模型不入源码仓库（超 GitHub 单文件限制），而**发行版 MSI 必须自带它**：
      # 否则从 Releases 安装的用户会遇到“语义记忆自动禁用”，而 README 写着“发行版 MSI 已内置”。
      # 用 cache 避免每版重下 600MB；如需镜像 / 内网源，设仓库变量 EMBEDDING_MODEL_URL（Settings → Variables）。
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: src/AguiGroupChat.Desktop/models
          key: embedding-model-bge-m3-q8-v1

      - name: Download embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          EMBEDDING_MODEL_URL: ${{ vars.EMBEDDING_MODEL_URL }}
        run: |
          $url = "$env:EMBEDDING_MODEL_URL".Trim()
          if ([string]::IsNullOrWhiteSpace($url)) {
            powershell -ExecutionPolicy Bypass -File tools/download-embedding-model.ps1
          } else {
            Write-Host "Using EMBEDDING_MODEL_URL override"
            powershell -ExecutionPolicy Bypass -File tools/download-embedding-model.ps1 -Url "$url"
          }

      # 硬闸门：模型缺失或明显不是 bge-m3（如误下 130MB 的 768 维模型）就**直接让发版失败**，
      # 而不静默交出一个“文档说已内置、实际跑不了 RAG”的瘦身安装包（这是实际踩过的坑）。
      - name: Verify embedding model is bundled
        shell: pwsh
        run: |
          $model = "src/AguiGroupChat.Desktop/models/embedding.gguf"
          if (-not (Test-Path $model)) {
            throw "Embedding model missing at $model - refusing to build a slim MSI (docs promise the model is bundled). Fix the download step or set the repo variable EMBEDDING_MODEL_URL."
          }
          $mb = (Get-Item $model).Length / 1MB
          Write-Host "Embedding model present: $([math]::Round($mb,1)) MB"
          if ($mb -lt 400) {
            throw "Embedding model is only $([math]::Round($mb,1)) MB - that is not bge-m3-Q8_0 (1024 dims, ~605MB) and would mismatch Agents:Memory:EmbeddingDimensions=1024, silently breaking RAG."
          }

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "src/AguiGroupChat.Desktop/AguiGroupChat.Desktop.csproj")
          $projVer = $xml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($projVer)) { throw "No <Version> found in csproj" }

          $override = "${{ github.event.inputs.version }}".Trim()
          $ver = if ($override -ne "") { $override } else { $projVer }

          # 打 tag 发版时：tag 必须与工程 <Version> 一致，否则会把安装包贴上错误的版本号
          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref_name }}" -replace '^v', ''
            if ($tag -ne $ver) {
              throw "Tag v$tag does not match project <Version> $ver. Bump the csproj (or retag) so the installer is labelled correctly."
            }
            Write-Host "Tag and project version agree: $ver"
          }

          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $ver"

      - name: Build MSI
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build-msi.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: agui-msi-${{ steps.ver.outputs.version }}
          path: artifacts/wix/AguiGroupChat-Desktop-${{ steps.ver.outputs.version }}.msi
          if-no-files-found: error

      # 统一走 gh：tag 触发与手动触发行为一致，且对已存在的同名 release 幂等（--clobber 覆盖附件）
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "v$ver"
          $repo = "${{ github.repository }}"
          $msi = "artifacts/wix/AguiGroupChat-Desktop-$ver.msi"
          # 显式带 --repo，避免依赖当前工作目录被判定为 gh 仓库
          gh release view $tag --repo $repo 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; uploading MSI over it."
            gh release upload $tag "$msi" --repo $repo --clobber
            # 既有的 release 可能是旧逻辑留下来的草稿：仅上传附件不会改变草稿状态，
            # 这里显式取消草稿，确保重跑后一定是已发布状态
            gh release edit $tag --repo $repo --draft=false
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag "$msi" --repo $repo `
              --title "AG-UI GroupChat Desktop $ver" `
              --notes "Windows 安装包：AguiGroupChat-Desktop-$ver.msi"
          }
