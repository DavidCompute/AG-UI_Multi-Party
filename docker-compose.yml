# AG-UI 群聊扩展协议 Hub —— 容器化编排（一键 RAG 记忆 + 人机交互演示）
#
# 默认启动：postgres（pgvector）+ ollama（自动拉取 embedding 模型）+ web。
# 浏览器打开 http://localhost:5200 即可体验：智能体回复前会自动检索群聊历史记忆（RAG）；
# 工具调用默认开启（Agents__EnableTools=true）——请求智能体「发布公告」时会在聊天区弹出
# 🔐 审批卡片（人机交互 HITL），仅发起请求的用户可批准 / 拒绝。
# 需要同时启动仅协议 Hub（http://localhost:5100）时启用 profile：
#   docker compose --profile hub up -d
#
# 存储 / 记忆（.env 的 STORAGE_PROVIDER / MEMORY_ENABLED）：
#   postgres（默认）+ Memory.Enabled=true：群聊数据 + 向量记忆全部落 PostgreSQL（pgvector），
#   embedding 由内置 ollama 服务提供（首次启动自动拉取 bge-m3 模型，约 1.2GB）
#   memory：进程内内存 + JSON 快照（关闭记忆体验，STORAGE_PROVIDER=memory 即切换）
#
# 配置项见 .env.example，复制为 .env 后按需修改（docker compose 自动读取）。

name: agui-group-chat

services:
  postgres:
    # pgvector 镜像：与 postgres 16 同内核，额外提供向量扩展（语义记忆 RAG 依赖）
    image: pgvector/pgvector:pg16
    container_name: agui-group-chat-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-agui}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-agui}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - agui-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-agui}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    # 语义记忆的 embedding 服务：启动时自动拉取模型（默认 bge-m3，中文语义效果好）
    image: ollama/ollama:latest
    container_name: agui-group-chat-ollama
    restart: unless-stopped
    ports:
      # 宿主机端口默认 11435（避开本机已装的 Ollama 11434）；web 容器内走内网 http://ollama:11434
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - agui-ollama-data:/root/.ollama
    environment:
      # 模型常驻内存：避免空闲 5 分钟后卸载导致的首次加载慢（如需释放内存改为 5m）
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    # 启动流程：serve → 拉模型 → 装 curl（镜像无 curl/wget）→ 预热加载（CPU 首次加载 bge-m3 需数十秒，预热后应用侧即时可用）；
    # 用 ; 串联：拉取/预热失败不终止 serve，容器保持可用，web 侧会打印告警日志
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5; echo 'Pulling embedding model ${MEMORY_EMBEDDING_MODEL:-bge-m3:latest}...'; ollama pull ${MEMORY_EMBEDDING_MODEL:-bge-m3:latest} || echo 'WARN: model pull failed (check network), embedding requests will fail until model is available'; (apt-get update -qq && apt-get install -y -qq --no-install-recommends curl >/dev/null 2>&1) || true; echo 'Warming up model...'; curl -s --max-time 300 http://localhost:11434/v1/embeddings -H 'Content-Type: application/json' -d '{\"model\":\"${MEMORY_EMBEDDING_MODEL:-bge-m3:latest}\",\"input\":\"warmup\"}' >/dev/null && echo 'Model warmup done' || echo 'WARN: model warmup failed'; wait"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # 版面 QA 工具（poppler-utils）：只在需要把产物 PDF 渲成 PNG 肉眼校验时开。
      # 注意：办公文档「在线查看」不靠它 —— LibreOffice 已在 Dockerfile 里**无条件安装**（预览端点的运行时依赖）。
      args:
        AGUI_PREVIEW_TOOLS: ${AGUI_PREVIEW_TOOLS:-false}
    image: agui-group-chat-web:latest
    container_name: agui-group-chat-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "${WEB_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # 模型提供方（mock / openai / deepseek）与连接参数
      Agents__Provider: ${AGENTS_PROVIDER:-deepseek}
      Agents__ApiKey: ${DEEPSEEK_API_KEY:-}
      # 透传环境变量密钥：模型配置「apiKey 留空」时回退进程环境变量（DEEPSEEK_API_KEY / OPENAI_API_KEY）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      Agents__Endpoint: ${AGENTS_ENDPOINT:-}
      Agents__Model: ${AGENTS_MODEL:-deepseek-chat}
      # 判定/路由类「小决策」（该不该发言 / 派给谁）专用模型。留空 = 自动用上面的非推理常规模型——
      # **故意不受思考模式影响**：判定调用的输出预算只有几个 token，推理模型会把预算全花在思维链上、
      # 正文为空，于是发言判定「永远不发言」、指派路由解析出 0 个下游（表现为「只有问题提升、没有任务指派」）。
      # 仅当你有意把判定也交给某个特定模型时才需要设置它。
      Agents__DecisionModel: ${AGENTS_DECISION_MODEL:-}
      # 判定为「是」所需的最低概率（0–1，默认 0.3）：低于此值按「否」处理，实际概率会写进日志。
      # 取 0.5 会把「属于其职责但未点名」这类本该发言的情形一并压掉（实测该档位概率约 0.33）。
      Agents__DecisionMinProbability: ${AGENTS_DECISION_MIN_PROBABILITY:-0.3}
      # 思考模式（默认开启）：智能体调用推理模型（deepseek-flash）做正式回复（可在「模型配置」弹窗开关）
      Agents__ThinkingMode: ${AGENTS_THINKING_MODE:-true}
      # 每用户每日 token 用量配额（0 = 不限）：超出后该用户当天无法再触发智能体（管理员控制台「用量统计」查看）
      Agents__DailyTokenQuotaPerUser: ${AGENTS_DAILY_TOKEN_QUOTA:-0}
      # 工具调用（默认开启）：内置 get_current_time（免审批）+ calculator / unit_converter /
      # group_memory_search / read_attachment + publish_announcement（需审批，人机交互 HITL）
      Agents__EnableTools: ${AGENTS_ENABLE_TOOLS:-true}
      # 网络类工具 web_search / read_url（默认关闭：需外网；开启后可搜索互联网 / 读取网页）
      Agents__EnableWebTools: ${AGENTS_ENABLE_WEBTOOLS:-false}
      # 内置「文档生成」技能（公文 / 通知公告 / 工作报告，Word .docx）：默认开启，新部署开箱即用。
      # 正文随程序集以嵌入资源分发；设 false 则不播种。图表渲染依赖系统字体（见 Dockerfile 的 fonts-*）。
      Agents__BuiltinDocxSkills: ${AGENTS_BUILTIN_DOCX_SKILLS:-true}
      # 内置「演示文稿生成」技能（pptx_deck）、「Excel 生成」技能（xlsx_book）、
      # 「PDF 生成」技能（pdf_doc）：同样默认开启。
      # 注：pdf_doc 需系统含中文字形的 glyf 字体（见 Dockerfile 的 fonts-droid-fallback），
      # 否则会把整份字体嵌进 PDF 导致产物 10MB+（可用 AGUI_PDF_FONT 指定字体）。
      Agents__BuiltinPptxSkills: ${AGENTS_BUILTIN_PPTX_SKILLS:-true}
      Agents__BuiltinXlsxSkills: ${AGENTS_BUILTIN_XLSX_SKILLS:-true}
      Agents__BuiltinPdfSkills: ${AGENTS_BUILTIN_PDF_SKILLS:-true}
      # 存储治理（管理员控制台「存储治理」页）：清空 / 删除话题、撤回消息都**不删附件文件**（附件是用户资料），
      # 于是磁盘上会积累“对话里已无入口”的孤儿。回收是破坏性操作，默认关闭；开启后管理员可在页面上一键回收。
      # 统计（只读）始终可看，无需开这个开关。
      StorageGovernance__AllowReclaim: ${STORAGE_ALLOW_RECLAIM:-false}
      # 孤儿判定宽限期（小时，默认 168 = 7 天）：刚上传还没发送、正在生成的产物都算“暂时无引用”，不能被当孤儿删。
      StorageGovernance__OrphanGraceHours: ${STORAGE_ORPHAN_GRACE_HOURS:-168}
      # 内置文档类技能的默认落盘目录（不传 outputPath 时用）；xlsx / pdf 未单独配置时沿用此项。
      # 对应下方 agui-docs 卷，容器重建/升级不影响已有文件。取文件见该卷旁的注释。
      AGUI_DOCX_OUT: ${AGUI_DOCX_OUT:-/app/docs}
      # 演示文稿技能的**联网配图**（imageQuery → Wikimedia Commons 检索真照片）端点。
      # 留空 = 用官方 API。注意：Wikimedia 在部分网络（如中国大陆）不可达 —— 实测本环境下
      # example.com / api.nuget.org 通，en.wikipedia.org / upload.wikimedia.org 返回 000。
      # 这类部署二选一：① 给下面的代理变量赋值（留空 = 不用代理，HttpClient 会读这两个变量）；
      # ② 把 AGUI_PHOTO_API 指到自建镜像/代理。都不可用时技能会自动降级为题图，不会失败。
      AGUI_PHOTO_API: ${AGUI_PHOTO_API:-}
      # 配图来源策略：auto（默认，先团队图库再网络）/ library（**仅图库，彻底不出网**，内网部署用这个）
      # / network（仅网络）。团队图库是用户上传的图片（数据面「图库」），按语义检索返回本地文件。
      AGUI_IMAGE_SOURCE: ${AGUI_IMAGE_SOURCE:-auto}
      # 代理。注意：一旦启用，容器内网服务也会被套上代理而连不上（如 ollama 的 embedding 端点），
      # 所以 NO_PROXY 默认就排除了内网服务名；在 .env 里改 NO_PROXY 会覆盖这个默认值。
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-ollama,postgres,localhost,127.0.0.1,::1}
      Agents__WebSearchEndpoint: ${AGENTS_WEB_SEARCH_ENDPOINT:-https://api.duckduckgo.com/}
      # 工作型智能体：开启后，标记为「工作型」的智能体可在其专属工作区（/app/data/workspaces/<agentId>/）
      # 读取/写入文件、执行白名单命令（写/删命令需群内人工审批）。默认关闭。
      Agents__WorkToolsEnabled: ${AGENTS_WORK_TOOLS_ENABLED:-false}
      Agents__WorkSpaceRoot: ${AGENTS_WORKSPACE_ROOT:-data/workspaces}
      # 需审批的工具名（命中后用 ApprovalRequiredAIFunction 包装，模型调用时运行中断等触发者决策）
      Agents__RequireApprovalToolNames__0: ${AGENTS_REQUIRE_APPROVAL_TOOLS:-publish_announcement}
      # 启动时播种示例群/成员/智能体（无历史数据时）
      GroupChat__SeedSampleData: ${SEED_SAMPLE_DATA:-true}
      # 实时连接 / 写接口强制令牌鉴权（默认 true：未携带有效 token 的连接与写请求一律 401；false 为旧客户端兼容回退）
      Auth__RequireTokenOnRealTime: ${REQUIRE_TOKEN_ON_REALTIME:-true}
      # 超级管理员名单（逗号分隔 userId/username，RBAC 分层）：命中者生效角色至少为 SuperAdmin，
      # 用于既有部署 bootstrap / 指定最高权限账号（管理平台角色）。留空则仅首个注册账号自举为 SuperAdmin。
      Auth__SuperAdminUserIds: ${AUTH_SUPER_ADMIN_USER_IDS:-}
      # 系统管理员名单（逗号分隔 userId/username，旧机制；命中者生效角色至少为 Admin）
      Auth__AdminUserIds: ${AUTH_ADMIN_USER_IDS:-}
      # 存储：postgres（默认，含向量记忆）；memory 为内存 + JSON 快照
      Storage__Provider: ${STORAGE_PROVIDER:-postgres}
      Storage__ConnectionString: ${STORAGE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=${PG_DATABASE:-agui};Username=${PG_USER:-postgres};Password=${PG_PASSWORD:-agui}}
      # 语义记忆（RAG）：默认开启，embedding 走内置 ollama 服务（bge-m3，1024 维）
      Agents__Memory__Enabled: ${MEMORY_ENABLED:-true}
      Agents__Memory__EmbeddingEndpoint: ${MEMORY_EMBEDDING_ENDPOINT:-http://ollama:11434/v1}
      Agents__Memory__EmbeddingModel: ${MEMORY_EMBEDDING_MODEL:-bge-m3:latest}
      Agents__Memory__EmbeddingDimensions: ${MEMORY_EMBEDDING_DIMENSIONS:-1024}
      Agents__Memory__TopK: ${MEMORY_TOP_K:-6}
      Agents__Memory__MinScore: ${MEMORY_MIN_SCORE:-0.25}
      Agents__Memory__Scope: ${MEMORY_SCOPE:-agent}
      Agents__Memory__KnowledgeChunkSize: ${MEMORY_KNOWLEDGE_CHUNK_SIZE:-4096}
      Agents__Memory__KnowledgeChunkOverlap: ${MEMORY_KNOWLEDGE_CHUNK_OVERLAP:-512}
      Agents__Memory__PersonalTopK: ${MEMORY_PERSONAL_TOP_K:-3}
      Agents__Memory__PersonalMinScore: ${MEMORY_PERSONAL_MIN_SCORE:-0.25}
      Agents__Memory__EmbeddingTimeoutSeconds: ${MEMORY_EMBEDDING_TIMEOUT:-60}
      # 提示词装配预算（顶层 PromptBudget 节点）：总闸门 / 历史窗口与单条截断 / 历史附件回喂 / 附件注入长度 / 附图数量。
      # 代码默认已按 1M 窗口放宽（总闸门 200000 字符、历史单条 4000、附件单文件 40000、合计 200000），
      # 因此无需在此配置；要非默认值必须显式补行（Docker 不透传未知键），如：PromptBudget__MaxTotalChars: "400000"
      # 字段与分层降级语义见 docs/agent-execution-algorithm.md §2.3
      # 正式回复的输出预算（<=0 = 不设）与推理力度（none/low/medium/high；默认空 = 不设，取值需实测后固定）：
      # Agents__MaxOutputTokens: "16000"
      # Agents__ReasoningEffort: "high"
      # 技能库 HTTP 是否放行本机/内网（SSRF 防护开关；默认关。确需调用本机/内网接口时置 true）
      Agents__AllowPrivateSkillEndpoints: ${AGENTS_ALLOW_PRIVATE_SKILL_ENDPOINTS:-false}
      # 内网穿透反向隧道（公网 Hub + 无公网 IP 的内网桥）：全局令牌 + 逐 agent 令牌 + 限流
      NativeTunnel__Token: ${NATIVE_TUNNEL_TOKEN:-}
      NativeTunnel__ConnectRateLimitPerMinute: ${NATIVE_TUNNEL_CONNECT_RATE:-120}
      NativeTunnel__ResultRateLimitPerMinute: ${NATIVE_TUNNEL_RESULT_RATE:-600}
      # 确定性编排计划（Coordinator Plan）：路由型数字员工先按组织/技能定计划再依次激活执行；默认开（可用环境变量覆盖）
      Agents__CoordinatorPlanning: ${AGENTS_COORDINATOR_PLANNING:-true}
      # 编排自动生成技能后的“自检”：是否对 server 执行的 shell 也盲跑一次（有副作用，默认开；置 0 关闭）
      Agents__SkillAutoTestServerShell: ${AGENTS_SKILL_AUTOTEST_SHELL:-true}
      # 图谱记忆（Graph RAG）：从群消息抽实体/关系建图，回复前按语义召回种子实体 + n 跳图遍历注入。默认关。
      Agents__Memory__GraphEnabled: ${MEMORY_GRAPH_ENABLED:-false}
      Agents__Memory__GraphTopK: ${MEMORY_GRAPH_TOP_K:-2}
      Agents__Memory__GraphMinScore: ${MEMORY_GRAPH_MIN_SCORE:-0.45}
      Agents__Memory__GraphHops: ${MEMORY_GRAPH_HOPS:-1}
      Agents__Memory__GraphMaxSectionChars: ${MEMORY_GRAPH_SECTION_CHARS:-700}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # memory 模式持久化快照 data/agui-state.json
      - agui-web-data:/app/data
      # 内置「文档生成」技能（docx_*）的产出目录：独立命名卷，便于单独备份 / 取文件。
      # 不传 outputPath 时文件落到这里（技能读环境变量 AGUI_DOCX_OUT）。
      # 用 /app/docs 而非 /app/data/docs：避免嵌套挂载与父卷（agui-web-data）产生叠加语义。
      # 取文件（任选其一）：
      #   docker cp agui-group-chat-web:/app/docs/<文件名>.docx .
      #   docker run --rm -v agui-docs:/d -v "$PWD/out:/out" alpine cp -r /d/. /out/
      - agui-docs:/app/docs
      # Web 项目 appsettings.json 被 csproj 从发布输出移除（避免污染桌面端），这里只读挂载回容器：
      # 提供 Agents:Agents 种子智能体定义等默认配置；环境变量（Agents__*）优先级更高，仍可覆盖
      - ./src/AguiGroupChat.Web/appsettings.json:/app/appsettings.json:ro

  hub:
    profiles: ["hub"]
    build:
      context: .
      dockerfile: Dockerfile.hub
    image: agui-group-chat-hub:latest
    container_name: agui-group-chat-hub
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HUB_PORT:-5100}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      GroupChat__SeedSampleData: ${SEED_SAMPLE_DATA_HUB:-false}
      Storage__Provider: ${STORAGE_PROVIDER_HUB:-postgres}
      Storage__ConnectionString: ${STORAGE_CONNECTION_STRING_HUB:-Host=postgres;Port=5432;Database=${PG_DATABASE:-agui};Username=${PG_USER:-postgres};Password=${PG_PASSWORD:-agui}}
    volumes:
      - agui-hub-data:/app/data

volumes:
  agui-web-data:
  agui-docs:
  agui-hub-data:
  agui-pg-data:
  agui-ollama-data:
